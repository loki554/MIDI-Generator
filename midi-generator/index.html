<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Algorithmic MIDI generator: drums, chords, bass, melodies and riffs with live preview, piano roll editor and .mid export."
    />
    <title>MIDI Generator</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash (see src/store/prefsStore.ts).
      try {
        var prefs = JSON.parse(localStorage.getItem('midigen-prefs') || 'null')
        if (prefs && prefs.state && prefs.state.theme === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
